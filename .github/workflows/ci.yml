name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: scanner, POSTGRES_PASSWORD: scanner, POSTGRES_DB: scanner }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scanner" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm fingerprints
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @site-scanner/web build
      - name: Migrations apply cleanly (two runners at once)
        env:
          DATABASE_URL: postgres://scanner:scanner@localhost:5432/scanner
        run: |
          cat > packages/db/ci-migrate.mts <<'TS'
          import { runMigrations } from './src/index.ts';
          await Promise.all([runMigrations(), runMigrations()]);
          console.log('migrations ok');
          TS
          cd packages/db && npx tsx ci-migrate.mts
