# Coolify: add as "Docker Compose" resource, point the domain at the `web` service (port 3000).
# Everything else stays on the internal network. See docs/DEPLOY.md.
services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://scanner:${POSTGRES_PASSWORD}@postgres:5432/site_scanner
      REDIS_URL: redis://redis:6379
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      SITE_NAME: ${SITE_NAME:-Site Scanner}
      OWN_HOSTS: ${OWN_HOSTS}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      IP_HASH_SALT: ${IP_HASH_SALT}
      BEHIND_CLOUDFLARE: ${BEHIND_CLOUDFLARE:-true}
      ABUSE_CONTACT: ${ABUSE_CONTACT:-}
      DENYLIST_EXTRA: ${DENYLIST_EXTRA:-}
      MAX_QUEUE_DEPTH: ${MAX_QUEUE_DEPTH:-20}
      SCREENSHOT_DIR: /data/screenshots
      ORIGIN: ${PUBLIC_SITE_URL}
    volumes:
      - screenshots:/data/screenshots
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://scanner:${POSTGRES_PASSWORD}@postgres:5432/site_scanner
      REDIS_URL: redis://redis:6379
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      OWN_HOSTS: ${OWN_HOSTS}
      OWN_IPS: ${OWN_IPS:-}
      DENYLIST_EXTRA: ${DENYLIST_EXTRA:-}
      SCAN_CONCURRENCY: ${SCAN_CONCURRENCY:-2}
      BROWSER_ENABLED: ${BROWSER_ENABLED:-true}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      SCREENSHOT_DIR: /data/screenshots
      SCREENSHOT_RETENTION_DAYS: ${SCREENSHOT_RETENTION_DAYS:-90}
      IP_RETENTION_DAYS: ${IP_RETENTION_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - screenshots:/data/screenshots
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Chromium needs a bigger /dev/shm than Docker's 64MB default.
    shm_size: 512m
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: site_scanner
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scanner -d site_scanner']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory', '128mb', '--maxmemory-policy', 'noeviction']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 160M

volumes:
  pgdata:
  screenshots:
